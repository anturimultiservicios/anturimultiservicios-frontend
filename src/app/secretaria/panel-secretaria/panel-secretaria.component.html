<div class="escritorio-secretaria">
  <!-- Barra superior secretaria -->
  <header class="barra-sup-sec">
    <div class="barra-sup-sec__logo">
      <img src="/assets/imagenes/logo.png" alt="Anturi" style="height: 36px;">
      <span class="barra-sup-sec__nombre">ANTURI</span>
    </div>
    <div class="barra-sup-sec__nav">
      <a routerLink="/secretaria" class="barra-sup-sec__enlace activo">Afiliados</a>
    </div>
    <div class="barra-sup-sec__controles">
      <button class="boton-tema" (click)="temaServicio.alternar()">
        <svg *ngIf="!temaServicio.esOscuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icono-tema">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="temaServicio.esOscuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icono-tema">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
        </svg>
      </button>
      <div class="barra-sup-sec__perfil">
        <div class="perfil-avatar">
          <span class="perfil-avatar__inicial">{{ auth.usuarioActual?.nombre?.charAt(0) }}</span>
        </div>
        <span class="barra-sup-sec__nombre-usuario">{{ nombreCompleto }}</span>
      </div>
      <button class="boton boton-peligro" style="font-size: var(--tamano-xs); padding: var(--espacio-2) var(--espacio-3);" (click)="cerrarSesion()">
        Salir
      </button>
    </div>
  </header>

  <main class="escritorio-secretaria__main">
    <h2 style="font-size: var(--tamano-2xl); font-weight: 700; color: var(--texto-principal); margin-bottom: var(--espacio-6);">
      Bienvenida, {{ auth.usuarioActual?.nombre }}
    </h2>
    <div class="tarjeta" style="padding: var(--espacio-8); text-align: center; color: var(--texto-terciario);">
      Módulos de secretaria disponibles según permisos asignados por el administrador.
      Conecte el backend para ver las funcionalidades habilitadas para su cuenta.
    </div>
  </main>

  <anturi-calculadora></anturi-calculadora>
</div>
