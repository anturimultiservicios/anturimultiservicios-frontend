<!-- Botón de acceso flotante (cerrada o minimizada: queda el ícono) -->
<div class="calc-acceso"
  *ngIf="estado !== 'abierta'"
  [style.right.px]="20"
  [style.bottom.px]="100">
  <button class="calc-acceso__btn" (click)="abrir()" [title]="pantalla !== '0' ? 'Calculadora (' + pantalla + ')' : 'Calculadora'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="2" width="16" height="20" rx="2"></rect>
      <line x1="8" y1="6" x2="16" y2="6"></line>
      <line x1="8" y1="10" x2="10" y2="10"></line>
      <line x1="12" y1="10" x2="14" y2="10"></line>
      <line x1="16" y1="10" x2="16" y2="10"></line>
      <line x1="8" y1="14" x2="10" y2="14"></line>
      <line x1="12" y1="14" x2="14" y2="14"></line>
      <line x1="16" y1="14" x2="16" y2="18"></line>
      <line x1="8" y1="18" x2="10" y2="18"></line>
      <line x1="12" y1="18" x2="14" y2="18"></line>
    </svg>
  </button>
</div>

<!-- Ventana calculadora -->
<div class="calc-ventana"
  #ventana
  *ngIf="estado === 'abierta'"
  [class.cientifica]="modo === 'cientifica'"
  [style.left.px]="posX"
  [style.top.px]="posY">

  <!-- Barra de título: se arrastra desde aquí; el modo se cambia con un clic -->
  <div class="calc-barra" (pointerdown)="iniciarArrastre($event)">
    <button class="calc-barra__modo" (pointerdown)="$event.stopPropagation()" (click)="alternarModo()"
      [title]="modo === 'normal' ? 'Cambiar a científica' : 'Cambiar a normal'">
      <!-- 2026-10-09: muestra el modo al que se pasa (el contrario al actual) -->
      {{ modo === 'normal' ? 'Científica' : 'Normal' }}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
    <div class="calc-barra__controles">
      <button class="calc-barra__btn historial" [class.activo]="verHistorial" (pointerdown)="$event.stopPropagation()" (click)="verHistorial = !verHistorial" title="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline>
        </svg>
      </button>
      <button class="calc-barra__btn minimizar" (pointerdown)="$event.stopPropagation()" (click)="minimizar()" title="Minimizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="calc-barra__btn cerrar" (pointerdown)="$event.stopPropagation()" (click)="cerrar()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Cuerpo calculadora -->
  <div class="calc-cuerpo">

    <!-- Pantalla -->
    <div class="calc-pantalla">
      <div class="calc-pantalla__expresion">{{ expresion || '&nbsp;' }}</div>
      <div class="calc-pantalla__resultado" [class.error]="hayError">{{ pantalla }}</div>
    </div>

    <!-- Historial de operaciones (queda guardado en este equipo) -->
    <div class="calc-historial" *ngIf="verHistorial">
      <div class="calc-historial__cabecera">
        <span>Historial</span>
        <button *ngIf="historial.length" class="calc-historial__borrar" (click)="borrarHistorial()">Borrar</button>
      </div>
      <p *ngIf="!historial.length" class="calc-historial__vacio">Aún no hay operaciones.</p>
      <button *ngFor="let h of historial" class="calc-historial__item" (click)="usarResultado(h.resultado)" title="Usar este resultado">
        <span class="calc-historial__expr">{{ h.expresion }} =</span>
        <span class="calc-historial__res">{{ h.resultado }}</span>
      </button>
    </div>

    <!-- Teclado científico adicional -->
    <div class="calc-teclado-cientifico" *ngIf="modo === 'cientifica'">
      <button class="calc-btn func" (click)="presionarYGuardar('sin')">sin</button>
      <button class="calc-btn func" (click)="presionarYGuardar('cos')">cos</button>
      <button class="calc-btn func" (click)="presionarYGuardar('tan')">tan</button>
      <button class="calc-btn func" (click)="presionarYGuardar('log')">log</button>
      <button class="calc-btn func" (click)="presionarYGuardar('ln')">ln</button>
      <button class="calc-btn func" (click)="presionarYGuardar('sqrt')">√x</button>
      <button class="calc-btn func" (click)="presionarYGuardar('x²')">x²</button>
      <button class="calc-btn func" (click)="presionarYGuardar('xʸ')">xʸ</button>
      <button class="calc-btn func" (click)="presionarYGuardar('1/x')">1/x</button>
      <button class="calc-btn func" (click)="presionarYGuardar('π')">π</button>
      <button class="calc-btn func" (click)="presionarYGuardar('e')">e</button>
      <button class="calc-btn func" (click)="presionarYGuardar('(')">(</button>
      <button class="calc-btn func" (click)="presionarYGuardar(')')">)</button>
    </div>

    <!-- Teclado principal -->
    <div class="calc-teclado">
      <button class="calc-btn especial" (click)="presionarYGuardar('AC')">AC</button>
      <button class="calc-btn especial" (click)="presionarYGuardar('+/-')">+/-</button>
      <button class="calc-btn especial" (click)="presionarYGuardar('%')">%</button>
      <button class="calc-btn operador" (click)="presionarYGuardar('/')">÷</button>

      <button class="calc-btn numero" (click)="presionarYGuardar('7')">7</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('8')">8</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('9')">9</button>
      <button class="calc-btn operador" (click)="presionarYGuardar('*')">×</button>

      <button class="calc-btn numero" (click)="presionarYGuardar('4')">4</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('5')">5</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('6')">6</button>
      <button class="calc-btn operador" (click)="presionarYGuardar('-')">-</button>

      <button class="calc-btn numero" (click)="presionarYGuardar('1')">1</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('2')">2</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('3')">3</button>
      <button class="calc-btn operador" (click)="presionarYGuardar('+')">+</button>

      <button class="calc-btn numero cero" (click)="presionarYGuardar('0')">0</button>
      <button class="calc-btn numero" (click)="presionarYGuardar('.')">.</button>
      <button class="calc-btn especial" (click)="presionarYGuardar('⌫')">⌫</button>
      <button class="calc-btn igual" (click)="presionarYGuardar('=')">=</button>
    </div>
  </div>

</div>
