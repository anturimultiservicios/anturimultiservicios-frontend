<!-- Botón flotante del bot (Anturi) -->
<div class="wa-flotante">

  <!-- Panel de chat -->
  <div class="wa-panel" [class.abierto]="abierto">
    <!-- Encabezado -->
    <div class="wa-panel__encabezado">
      <div class="wa-panel__info">
        <div class="wa-panel__avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="wa-icono-robot">
            <line x1="12" y1="2.5" x2="12" y2="6"></line>
            <circle cx="12" cy="2" r="1" fill="currentColor" stroke="none"></circle>
            <rect x="4" y="6" width="16" height="13" rx="4"></rect>
            <circle cx="9" cy="12.5" r="1.3" fill="currentColor" stroke="none"></circle>
            <circle cx="15" cy="12.5" r="1.3" fill="currentColor" stroke="none"></circle>
            <path d="M9 16c1 .8 5 .8 6 0"></path>
          </svg>
        </div>
        <div>
          <p class="wa-panel__nombre">{{ 'chatbot.titulo' | translate }}</p>
          <p class="wa-panel__estado">{{ 'chatbot.subtitulo' | translate }}</p>
        </div>
      </div>
      <button class="wa-panel__cerrar boton-icono" (click)="cerrar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mensajes -->
    <div class="wa-panel__mensajes">
      <div *ngFor="let msg of mensajes"
           class="wa-mensaje"
           [class.wa-mensaje--bot]="msg.tipo === 'bot'"
           [class.wa-mensaje--usuario]="msg.tipo === 'usuario'">
        {{ msg.texto }}
      </div>

      <!-- Preguntas rápidas -->
      <div class="wa-preguntas" *ngIf="mostrarPreguntas">
        <button *ngFor="let p of preguntas"
                class="wa-pregunta-btn"
                (click)="responder(p.clave)">
          {{ p.textoKey | translate }}
        </button>
      </div>
    </div>

    <!-- Botón WhatsApp directo -->
    <div class="wa-panel__accion">
      <button class="boton boton-secundario wa-btn-directo" (click)="abrirWhatsApp('')">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.097.536 4.07 1.476 5.789L.057 23.25l5.641-1.478A11.958 11.958 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.854 0-3.6-.5-5.11-1.373l-.366-.217-3.348.877.896-3.272-.237-.381A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
        </svg>
        {{ 'chatbot.botonWhatsapp' | translate }}
      </button>
    </div>
  </div>

  <!-- 2026-10-07 (video real de Cristopher): reemplaza la foto estática
       del 2026-10-01 - aquella no podía mover el brazo por separado sin
       arruinar la imagen ("en cambio se balancea el personaje completo"),
       este video sí trae el saludo real. Fondo blanco sólido del video
       (no tiene alpha, confirmado: códec h264/yuv420p) - se usa
       mix-blend-mode:multiply para que el blanco desaparezca visualmente
       sobre cualquier fondo de la página, sin reeditar el archivo.
       poster = la foto vieja, se ve mientras el video carga. -->
  <button *ngIf="!abierto" class="wa-robot" (click)="abrir()" [attr.aria-label]="'chatbot.titulo' | translate">
    <video
      class="wa-robot__video"
      src="/assets/bot/bot-anturi.mp4"
      poster="/assets/imagenes/bot-anturi.png"
      autoplay loop muted playsinline
      disablepictureinpicture
    ></video>
  </button>

  <button *ngIf="abierto" class="wa-boton-cerrar" (click)="cerrar()" aria-label="Cerrar chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

</div>
